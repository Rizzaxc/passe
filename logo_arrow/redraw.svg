<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Passe mark">
  <defs>
    <linearGradient id="pRed" x1="28" y1="20" x2="80" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF1F32"/>
      <stop offset="1" stop-color="#E60043"/>
    </linearGradient>
    <linearGradient id="pPink" x1="72" y1="47" x2="45" y2="79" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5680"/>
      <stop offset="1" stop-color="#FB979C"/>
    </linearGradient>
  </defs>
  <!-- back blade -->
  <polygon points="21,22 59,50 21,78 42,50" fill="#E63950"/>
  <!-- front blade, upper arm -->
  <polygon points="40,22 79,50 62,50" fill="url(#pRed)"/>
  <!-- front blade, lower arm (pink sheen) -->
  <polygon points="62,50 79,50 41,78" fill="url(#pPink)"/>
</svg>

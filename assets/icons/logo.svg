    <polygon points="58,33 80,50 58,50" fill="#3090F2" opacity="0.22"/>
    <polygon points="58,50 80,50 58,67" fill="#959D54" opacity="0.24"/>
    <polygon points="58,50 58,67 36,84" fill="#ffffff" opacity="0.10"/>

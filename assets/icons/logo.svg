  </defs>

  <!-- base three-tone -->
  <path d="M12 16 L56 50 L12 84 L34 50 Z" fill="#C21540"/>
  <path d="M36 16 L80 50 L58 50 Z" fill="url(#G2)"/>
  <path d="M58 50 L80 50 L36 84 Z" fill="url(#G1)"/>

  <!-- glass / prismatic refraction (filter-free; flutter_svg + vector_graphics safe) -->
  <g clip-path="url(#ac)">
    <polygon points="12,16 34,33 34,50" fill="#ffffff" opacity="0.12"/>
    <polygon points="34,33 56,50 34,50" fill="#8A0F2E" opacity="0.14"/>
    <polygon points="34,50 56,50 34,67" fill="#ffffff" opacity="0.07"/>
    <polygon points="34,50 34,67 12,84" fill="#8A0F2E" opacity="0.12"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Passe mark: original double-chevron geometry (clean-room, no third-party vector data) -->
  <defs>
    <linearGradient id="G2" gradientUnits="userSpaceOnUse" x1="36" y1="18" x2="80" y2="58">
      <stop offset="0" stop-color="#FF3760"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
    <linearGradient id="G1" gradientUnits="userSpaceOnUse" x1="78" y1="50" x2="42" y2="84">
      <stop offset="0" stop-color="#FF7D97"/><stop offset="1" stop-color="#FFB6C6"/></linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <radialGradient id="specBlue" cx="0.5" cy="0.5" r="0.5">
